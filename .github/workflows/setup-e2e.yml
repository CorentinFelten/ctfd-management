name: Setup end-to-end

# Runs setup.sh for real on fresh runners and checks the resulting stack:
#   - no HTTPS, local Galvanize instancer: also deploys a challenge instance
#     through Galvanize, and finally switches the deployment to an external
#     instancer;
#   - HTTPS (Pebble), local instancer: same, with certificates;
#   - --no-instancer and --instancer-url: CTFd without a local instancer; the
#     --no-instancer job also installs, keeps and removes custom themes;
#   - Debian 13: no HTTPS with a local instancer, in a fresh Debian virtual
#     machine (Incus, KVM) on the runner, where setup.sh installs Docker
#     itself. GitHub has no Debian runners, and a Debian container has no
#     systemd or Docker daemon.
# Every job then re-runs setup to check that re-runs are safe.
#
# HTTPS mode uses Pebble, Let's Encrypt's test ACME server, on the runner: the
# domain is <runner-ip>.sslip.io (public wildcard DNS to the runner's IP), and
# the DNS-01 challenge goes to lego's exec provider running a no-op, since
# Pebble is told to accept every challenge. Everything else (setup's DNS
# wizard and Traefik config patching, certificate issuance, strict TLS to
# CTFd, the instancer and challenge instances) runs as on a real server.

on:
  # Branches only: main receives merges of branches whose run already
  # passed, so it is not tested again (run it by hand if needed).
  push:
    branches-ignore:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: setup-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup:
    name: setup.sh ${{ matrix.name }} (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "--no-https", id: http, tls: http, instancer: local }
          - { name: "HTTPS (Pebble)", id: https, tls: https, instancer: local }
          - { name: "--no-instancer", id: no-instancer, tls: http, instancer: none }
          - { name: "--instancer-url", id: external-instancer, tls: http, instancer: external }
    env:
      E2E: .github/scripts/setup-e2e
      TLS: ${{ matrix.tls }}
      INSTANCER: ${{ matrix.instancer }}
      # Never contacted: setup.sh only hands it to CTFd
      EXTERNAL_INSTANCER_URL: https://instancer.ci-external.example.org
      PEBBLE_IMAGE: ghcr.io/letsencrypt/pebble:2.10.1
    steps:
      - uses: actions/checkout@v7

      # setup.sh expects a server that already runs sshd: Galvanize deploys
      # challenges with Ansible over SSH to the --domain address.
      - name: Prepare the runner as a server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          sudo systemctl enable --now ssh
          server_ip="$(ip -4 route get 1.1.1.1 | awk '{for (i = 1; i < NF; i++) if ($i == "src") { print $(i + 1); exit }}')"
          [[ -n "$server_ip" ]] || { echo "::error::Could not determine the runner's IP address"; exit 1; }

          if [[ "$TLS" == https ]]; then
            domain="${server_ip//./-}.sslip.io"
            setup_args="--domain $domain --acme-email ci@example.org --dns-provider cloudflare"
            getent hosts "$domain" "instancer.$domain" \
              || { echo "::error::$domain does not resolve (sslip.io unreachable?)"; exit 1; }
          else
            domain="$server_ip"
            setup_args="--domain $server_ip"
          fi

          case "$INSTANCER" in
            none)     setup_args+=" --no-instancer" ;;
            external) setup_args+=" --instancer-url $EXTERNAL_INSTANCER_URL"
                      echo "INSTANCER_URL=$EXTERNAL_INSTANCER_URL" >> "$GITHUB_ENV" ;;
          esac

          {
            echo "SERVER_IP=$server_ip"
            echo "DOMAIN=$domain"
            echo "SETUP_ARGS=$setup_args --working-folder $HOME --yes"
            echo "DEPLOY_DIR=$HOME/deploy"
          } >> "$GITHUB_ENV"
          echo "Server IP: $server_ip, domain: $domain, setup.sh $setup_args"

      # Two themes: a local folder (with a hidden file, which must be copied)
      # and a Git repository, pinned to a tag older than its last commit
      - name: Prepare theme fixtures (--no-instancer)
        if: matrix.id == 'no-instancer'
        run: |
          themes="$RUNNER_TEMP/themes"
          mkdir -p "$themes/alpha/templates"
          echo alpha > "$themes/alpha/templates/version.txt"
          echo hidden > "$themes/alpha/.hidden"

          git init -q -b main "$themes/beta-src"
          mkdir "$themes/beta-src/templates"
          ci_git() { git -C "$themes/beta-src" -c user.name=ci -c user.email=ci@example.org "$@"; }
          echo v1 > "$themes/beta-src/templates/version.txt"
          ci_git add -A && ci_git commit -qm v1 && ci_git tag v1
          echo v2 > "$themes/beta-src/templates/version.txt"
          ci_git commit -qam v2
          git clone -q --bare "$themes/beta-src" "$themes/beta.git"

          echo "THEME_ARGS=--theme $themes/alpha --theme $themes/beta.git#v1 --active-theme alpha" >> "$GITHUB_ENV"

      - name: setup.sh rejects a loopback --domain
        if: matrix.id == 'http'
        run: |
          if output="$(./setup.sh --domain 127.0.0.1 --yes 2>&1)"; then
            echo "$output"
            echo "::error::setup.sh accepted --domain 127.0.0.1"
            exit 1
          fi
          echo "$output"
          grep "loopback address" <<< "$output" >/dev/null

      - name: Start Pebble (HTTPS)
        if: matrix.tls == 'https'
        run: |
          # No nonce rejections: they only test client retries and make runs flaky
          docker run -d --name pebble --restart unless-stopped \
            -p 14000:14000 -p 15000:15000 \
            -e PEBBLE_VA_ALWAYS_VALID=1 -e PEBBLE_VA_NOSLEEP=1 -e PEBBLE_WFE_NONCEREJECT=0 \
            "$PEBBLE_IMAGE"
          # CA of Pebble's own HTTPS endpoint (not of the certificates it issues),
          # placed where the Traefik container sees it (letsencrypt/ is mounted)
          mkdir -p "$DEPLOY_DIR/traefik-config/letsencrypt"
          docker cp pebble:/test/certs/pebble.minica.pem "$DEPLOY_DIR/traefik-config/letsencrypt/pebble-minica.pem"
          for _ in $(seq 30); do
            curl -fsS --cacert "$DEPLOY_DIR/traefik-config/letsencrypt/pebble-minica.pem" \
              https://localhost:14000/dir >/dev/null && exit 0
            sleep 2
          done
          echo "::error::Pebble did not start"; docker logs pebble; exit 1

      # CI only: the checkout's Traefik template is pointed at Pebble instead of
      # Let's Encrypt, and the DNS-01 challenge at lego's exec provider. setup.sh
      # copies and patches this template as usual.
      - name: Point the Traefik template at Pebble (HTTPS)
        if: matrix.tls == 'https'
        run: |
          yq -i '
            .certificatesResolvers.letsencrypt.acme.caServer = "https://" + strenv(SERVER_IP) + ":14000/dir" |
            .certificatesResolvers.letsencrypt.acme.caServerName = "pebble" |
            .certificatesResolvers.letsencrypt.acme.caCertificates = ["/etc/traefik/letsencrypt/pebble-minica.pem"] |
            .certificatesResolvers.letsencrypt.acme.dnsChallenge.provider = "exec" |
            .certificatesResolvers.letsencrypt.acme.dnsChallenge.propagation.disableChecks = true
          ' config/traefik/traefik.yml
          git diff -- config/traefik/traefik.yml

          # Existing DNS credentials, which setup.sh --yes must keep, plus the
          # no-op command the exec provider runs instead of a DNS API call
          (
            umask 077
            cat > "$DEPLOY_DIR/traefik.env" <<'ENV'
          CF_DNS_API_TOKEN=ci-placeholder-token
          EXEC_PATH=/bin/true
          ENV
          )

      # stdin is /dev/null so any prompt that --yes misses fails the run
      - name: Run setup.sh
        run: ./setup.sh $SETUP_ARGS $THEME_ARGS < /dev/null

      # Pebble creates a new issuing root at startup; checks verify against it
      - name: Trust Pebble's issuing root (HTTPS)
        if: matrix.tls == 'https'
        run: |
          curl -fsS --cacert "$DEPLOY_DIR/traefik-config/letsencrypt/pebble-minica.pem" \
            https://localhost:15000/roots/0 > "$RUNNER_TEMP/pebble-root.pem"
          echo "CA_FILE=$RUNNER_TEMP/pebble-root.pem" >> "$GITHUB_ENV"

      - name: Check the stack
        run: bash "$E2E/check-stack.sh"

      - name: Check the themes (--no-instancer)
        if: matrix.id == 'no-instancer'
        env:
          EXPECT_THEMES: alpha beta
          EXPECT_FILES: alpha/.hidden alpha/templates/version.txt=alpha beta/templates/version.txt=v1
          ACTIVE_THEME: alpha
        run: bash "$E2E/check-themes.sh"

      - name: Deploy a challenge through Galvanize
        if: matrix.instancer == 'local'
        run: bash "$E2E/deploy-challenge.sh" ci-team-1

      - name: Re-run setup.sh
        run: bash "$E2E/rerun-setup.sh"

      - name: Check the stack after the re-run
        run: bash "$E2E/check-stack.sh"

      # The re-run passes no theme options: installed themes must stay
      - name: Check the themes after the re-run (--no-instancer)
        if: matrix.id == 'no-instancer'
        env:
          EXPECT_THEMES: alpha beta
          ACTIVE_THEME: alpha
        run: bash "$E2E/check-themes.sh"

      - name: Remove a theme and reset the active theme (--no-instancer)
        if: matrix.id == 'no-instancer'
        env:
          EXPECT_THEMES: alpha
          ABSENT_THEMES: beta
          ACTIVE_THEME: core
        run: |
          bash "$E2E/rerun-setup.sh" --remove-theme beta --active-theme core
          bash "$E2E/check-themes.sh"

      - name: Deploy a challenge with the recreated SSH key
        if: matrix.instancer == 'local'
        run: bash "$E2E/deploy-challenge.sh" ci-team-2

      # Re-running setup with --instancer-url must stop and remove the local
      # instancer container (compose leaves containers of inactive profiles
      # running). Its data and Ansible user are left behind on purpose.
      - name: Switch to an external instancer
        if: matrix.id == 'http'
        env:
          INSTANCER: external
          INSTANCER_URL: ${{ env.EXTERNAL_INSTANCER_URL }}
          FRESH_INSTALL: "false"
        run: |
          bash "$E2E/rerun-setup.sh" --instancer-url "$INSTANCER_URL"
          bash "$E2E/check-stack.sh"

      - name: Collect diagnostics
        if: failure()
        run: bash "$E2E/collect-diagnostics.sh" "$RUNNER_TEMP/diagnostics"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: setup-e2e-diagnostics-${{ matrix.id }}
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: ignore

  setup-debian:
    name: setup.sh --no-https (Debian 13 VM)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      E2E: .github/scripts/setup-e2e
      VM_NAME: server
      INSTANCER: local
    steps:
      - uses: actions/checkout@v7

      # A sudo user, sshd and a copy of the repository; exports SERVER_IP,
      # DOMAIN, DEPLOY_DIR and SETUP_ARGS for the VM
      - name: Boot a Debian 13 VM
        run: bash "$E2E/vm-start.sh" debian/13

      - name: Run setup.sh
        run: bash "$E2E/vm-run.sh" ./setup.sh $SETUP_ARGS

      - name: Check the stack
        run: bash "$E2E/vm-run.sh" bash "$E2E/check-stack.sh"

      - name: Deploy a challenge through Galvanize
        run: bash "$E2E/vm-run.sh" bash "$E2E/deploy-challenge.sh" ci-team-1

      - name: Re-run setup.sh
        run: bash "$E2E/vm-run.sh" bash "$E2E/rerun-setup.sh"

      - name: Check the stack after the re-run
        run: bash "$E2E/vm-run.sh" bash "$E2E/check-stack.sh"

      - name: Deploy a challenge with the recreated SSH key
        run: bash "$E2E/vm-run.sh" bash "$E2E/deploy-challenge.sh" ci-team-2

      - name: Collect diagnostics
        if: failure()
        run: |
          diag="$RUNNER_TEMP/diagnostics"
          mkdir -p "$diag"
          sudo incus info "$VM_NAME" --show-log > "$diag/vm-info.txt" 2>&1 || true
          if [[ -n "${DEPLOY_DIR:-}" ]]; then
            bash "$E2E/vm-run.sh" bash "$E2E/collect-diagnostics.sh" /tmp/diagnostics || true
            sudo incus file pull -r "$VM_NAME/tmp/diagnostics" "$diag/" || true
          fi
          sudo chown -R "$USER" "$diag"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: setup-e2e-diagnostics-debian-13
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: ignore
