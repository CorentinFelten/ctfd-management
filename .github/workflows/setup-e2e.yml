name: Setup end-to-end

# Runs setup.sh for real on fresh runners and checks the resulting stack:
#   - no HTTPS, local Galvanize instancer: also deploys a challenge instance
#     through Galvanize, and finally switches the deployment to an external
#     instancer;
#   - HTTPS (Pebble), local instancer: same, with certificates;
#   - --no-instancer and --instancer-url: CTFd without a local instancer; the
#     --no-instancer job also installs, keeps and removes custom themes, and
#     both upload their backups off-site (--backup-remote): to an S3 bucket
#     (rclone serve s3) and to a folder given as an rclone connection string;
#   - Debian 13: no HTTPS with a local instancer, in a fresh Debian virtual
#     machine (Incus, KVM) on the runner, where setup.sh installs Docker
#     itself. GitHub has no Debian runners, and a Debian container has no
#     systemd or Docker daemon.
# Every job then re-runs setup to check that re-runs are safe. The Ubuntu
# jobs are defined in setup-e2e-ubuntu.yml, also used by galvanize-e2e.yml.
#
# HTTPS mode uses Pebble, Let's Encrypt's test ACME server, on the runner: the
# domain is <runner-ip>.sslip.io (public wildcard DNS to the runner's IP), and
# the DNS-01 challenge goes to lego's exec provider running a no-op, since
# Pebble is told to accept every challenge. Everything else (setup's DNS
# wizard and Traefik config patching, certificate issuance, strict TLS to
# CTFd, the instancer and challenge instances) runs as on a real server.

on:
  # Branches only: main receives merges of branches whose run already
  # passed, so it is not tested again (run it by hand if needed).
  push:
    branches-ignore:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
  # Manual runs test the published Galvanize image like pushes. To test an
  # unreleased Galvanize version, run galvanize-e2e.yml instead.
  workflow_dispatch:

concurrency:
  group: setup-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup:
    name: Ubuntu
    uses: ./.github/workflows/setup-e2e-ubuntu.yml
    with:
      scenarios: >-
        [
          { "name": "--no-https", "id": "http", "tls": "http", "instancer": "local" },
          { "name": "HTTPS (Pebble)", "id": "https", "tls": "https", "instancer": "local" },
          { "name": "--no-instancer", "id": "no-instancer", "tls": "http", "instancer": "none" },
          { "name": "--instancer-url", "id": "external-instancer", "tls": "http", "instancer": "external" }
        ]

  setup-debian:
    name: setup.sh --no-https (Debian 13 VM)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      E2E: .github/scripts/setup-e2e
      VM_NAME: server
      INSTANCER: local
      CTFD_ADMIN_NAME: ci-admin
      CTFD_ADMIN_PASSWORD: 'ci P@ss&w0rd=1+2 #"x"'
      EXPECT_CTF_NAME: PolyPwn-CI
      EXPECT_USER_MODE: teams
      ADMIN_ARGS: --admin-name ci-admin --admin-email admin@ci.example.org --ctf-name PolyPwn-CI --user-mode teams
    steps:
      - uses: actions/checkout@v7

      # A sudo user, sshd and a copy of the repository; exports SERVER_IP,
      # DOMAIN, DEPLOY_DIR and SETUP_ARGS for the VM
      - name: Boot a Debian 13 VM
        run: bash "$E2E/vm-start.sh" debian/13

      - name: Run setup.sh
        run: bash "$E2E/vm-run.sh" sudo --preserve-env=CTFD_ADMIN_PASSWORD ./setup.sh $SETUP_ARGS $ADMIN_ARGS

      - name: Check the stack
        run: |
          bash "$E2E/vm-run.sh" bash "$E2E/check-stack.sh"
          bash "$E2E/vm-run.sh" bash "$E2E/check-ctfd-setup.sh"

      - name: Deploy a challenge through Galvanize
        run: bash "$E2E/vm-run.sh" bash "$E2E/deploy-challenge.sh" ci-team-1

      - name: Re-run setup.sh
        run: bash "$E2E/vm-run.sh" bash "$E2E/rerun-setup.sh"

      - name: Check the stack after the re-run
        run: |
          bash "$E2E/vm-run.sh" bash "$E2E/check-stack.sh"
          bash "$E2E/vm-run.sh" bash "$E2E/check-ctfd-setup.sh"

      - name: Deploy a challenge with the recreated SSH key
        run: bash "$E2E/vm-run.sh" bash "$E2E/deploy-challenge.sh" ci-team-2

      - name: Collect diagnostics
        if: failure()
        run: |
          diag="$RUNNER_TEMP/diagnostics"
          mkdir -p "$diag"
          sudo incus info "$VM_NAME" --show-log > "$diag/vm-info.txt" 2>&1 || true
          if [[ -n "${DEPLOY_DIR:-}" ]]; then
            bash "$E2E/vm-run.sh" bash "$E2E/collect-diagnostics.sh" /tmp/diagnostics || true
            sudo incus file pull -r "$VM_NAME/tmp/diagnostics" "$diag/" || true
          fi
          sudo chown -R "$USER" "$diag"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: setup-e2e-diagnostics-debian-13
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: ignore
